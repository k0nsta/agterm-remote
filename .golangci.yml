version: "2"

linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        remote-no-daemon:
          files:
            - "**/internal/remote/**/*.go"
          deny:
            - pkg: github.com/k0nsta/agterm-remote/internal/daemon
              desc: internal/remote must not import internal/daemon
