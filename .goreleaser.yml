version: 2

project_name: agr

builds:
  - id: agr
    main: ./cmd/agr
    binary: agr
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
      - amd64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: agr
    ids:
      - agr
    formats:
      - tar.gz
    name_template: "agr_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: agr
    ids:
      - agr
    repository:
      owner: k0nsta
      name: homebrew-apps
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/k0nsta/agterm-remote
    description: Bridge remote agent status into agterm
    license: MIT
    binaries:
      - agr
    # the binaries are unsigned, so macOS quarantines what brew downloads.
    # a custom_block, because goreleaser wraps hooks.post.install in the
    # postflight stanza homebrew deprecated in favour of postflight_steps
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr",
              args: ["-dr", "com.apple.quarantine", "{{ `{{staged_path}}` }}/agr"]
        end
      end
