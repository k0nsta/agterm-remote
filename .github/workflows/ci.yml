name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Go linter
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: Install shellcheck and tmux
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "macOS" ]; then
            brew install shellcheck tmux
          else
            sudo apt-get update
            sudo apt-get install -y shellcheck tmux
          fi

      - name: Run checks
        run: make check
